name: Flutter Release Build & Upload

on:
  push:
    branches:
      - main
      - dev
      - ahmadDev
      - devAhmad
      - sarimDev
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Flutter Release APK
    runs-on: macos-latest

    steps:
      # 1. Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. Setup Java (required for Flutter Android build)
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: 17

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # 4. Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 5. Build Android release APKs (split per ABI)
      - name: Build Android Release APKs
        run: flutter build apk --release --split-per-abi

      # 6. Install rclone
      - name: Install rclone
        run: brew install rclone

      # 7. Configure rclone with personal Gmail OAuth
      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          echo '${{ secrets.RCLONE_CONFIG_CONTENT }}' > ~/.config/rclone/rclone.conf

      # 8. Upload release APKs to Google Drive
      - name: Upload release APKs to Google Drive
        run: |
          rclone copy build/app/outputs/apk/release/app-armeabi-v7a-release.apk gdrive:builds/app_release_armeabi-v7a.apk
          rclone copy build/app/outputs/apk/release/app-arm64-v8a-release.apk gdrive:builds/app_release_arm64-v8a.apk
          rclone copy build/app/outputs/apk/release/app-x86_64-release.apk gdrive:builds/app_release_x86_64.apk

      # 9. Upload release APKs to GitHub Release
      - name: Upload to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            build/app/outputs/apk/release/*
          tag: v1.0.${{ github.run_number }}
          token: ${{ secrets.TOKEN }}